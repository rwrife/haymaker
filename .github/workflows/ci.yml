name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-package:
    name: Linux package tests (swift test)
    runs-on: ubuntu-latest
    container:
      image: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Swift version
        run: swift --version
      - name: Run HaymakerKit package tests
        run: swift test --package-path Packages/HaymakerKit
      - name: Install SQLite development headers
        run: apt-get update -qq && apt-get install -y libsqlite3-dev
      - name: Run HaymakerStore package tests
        # Ubuntu's SQLite omits the optional snapshot API; DatabaseQueue does not use it.
        run: swift test --package-path Packages/HaymakerStore -Xswiftc -DGRDBCUSTOMSQLITE
      - name: Run app session host adapter probe
        env:
          HAYMAKER_PROBE_SCRATCH: /var/local/haymaker-probes
        run: bash scripts/test_host_sessions.sh
      - name: Zero-network gate
        run: bash scripts/check_zero_network.sh
      - name: Native-only framework gate
        run: bash scripts/check_native_only.sh
      - name: Gitignore keeps signing material out
        run: |
          set -e
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          for f in fake.p8 fake.p12 fake.mobileprovision fake.cer; do
            touch "$f"
            git check-ignore -q "$f" || { echo "FAIL: $f is not gitignored"; exit 1; }
            rm "$f"
          done
          echo "Signing-material gitignore check: PASS"

  ios-build:
    name: iOS build + iPhone-only + toolchain pin
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Select exact pinned toolchain (blocker if absent)
        run: |
          set -euo pipefail
          # toolchain.json pin: Xcode 26.0.1 / 17A400 / iOS SDK 26.0.
          # A missing exact pin is an ENVIRONMENT ACCEPTANCE BLOCKER —
          # never silently substitute another Xcode.
          REQUIRED_VERSION="Xcode 26.0.1"
          REQUIRED_BUILD="17A400"
          found=""
          for app in /Applications/Xcode_26.0.1.app /Applications/Xcode_26.0.1_*.app /Applications/Xcode_26.0.app /Applications/Xcode.app; do
            [ -d "$app" ] || continue
            dev="$app/Contents/Developer"
            ver=$(DEVELOPER_DIR="$dev" xcodebuild -version 2>/dev/null | tr -d '\r') || continue
            vline=$(echo "$ver" | head -1)
            bline=$(echo "$ver" | grep -i "build version" | awk '{print $3}')
            if [ "$vline" = "$REQUIRED_VERSION" ] && [ "$bline" = "$REQUIRED_BUILD" ]; then
              found="$dev"
              echo "Exact pin found: $app ($vline, build $bline)"
              break
            fi
          done
          if [ -z "$found" ]; then
            echo "::error::ACCEPTANCE BLOCKER: required toolchain $REQUIRED_VERSION ($REQUIRED_BUILD) not present on this runner. Enumerated candidates:"
            for app in /Applications/Xcode*.app; do
              [ -d "$app" ] || continue
              echo "$app -> $(DEVELOPER_DIR="$app/Contents/Developer" xcodebuild -version 2>/dev/null | tr -d '\r' | head -1)"
            done
            exit 1
          fi
          # Make the pinned toolchain the default for every later step.
          sudo xcode-select -s "$found"
          xcodebuild -version

      - name: Assert iOS SDK 26.0 available
        run: |
          set -euo pipefail
          xcodebuild -sdk iphoneos -showsdks \
            | grep -E "iphonesimulator26\.0\b" \
            || { echo "::error::ACCEPTANCE BLOCKER: iphonesimulator26.0 SDK missing from pinned Xcode"; exit 1; }

      - name: Zero-network gate
        run: bash scripts/check_zero_network.sh

      - name: Native-only framework gate
        run: bash scripts/check_native_only.sh

      - name: iPhone-only pre-build assertion
        run: |
          set -euo pipefail
          echo "--- asserting TARGETED_DEVICE_FAMILY = 1 in Haymaker.xcodeproj ---"
          grep -q "TARGETED_DEVICE_FAMILY = 1;" Haymaker.xcodeproj/project.pbxproj \
            || { echo "::error::TARGETED_DEVICE_FAMILY = 1 missing from project"; exit 1; }
          if grep -q "TARGETED_DEVICE_FAMILY = 1,2;" Haymaker.xcodeproj/project.pbxproj; then
            echo "::error::iPad family (1,2) found — iPhone-only directive violated"
            exit 1
          fi
          # Every explicit TARGETED_DEVICE_FAMILY setting must be exactly 1.
          bad=$(grep -E "TARGETED_DEVICE_FAMILY = [^1;]" Haymaker.xcodeproj/project.pbxproj || true)
          if [ -n "$bad" ]; then
            echo "::error::Non-iPhone TARGETED_DEVICE_FAMILY values found:"
            echo "$bad"
            exit 1
          fi
          count=$(grep -c "TARGETED_DEVICE_FAMILY = 1;" Haymaker.xcodeproj/project.pbxproj)
          echo "TARGETED_DEVICE_FAMILY = 1 asserted in $count places"

      - name: Run HaymakerKit package tests on pinned macOS toolchain
        run: swift test --package-path Packages/HaymakerKit
      - name: Run HaymakerStore package tests and migrations on pinned macOS toolchain
        run: swift test --package-path Packages/HaymakerStore
      - name: Run app session host adapter probe on pinned macOS toolchain
        env:
          HAYMAKER_PROBE_SCRATCH: ${{ runner.temp }}/haymaker-probes
        run: bash scripts/test_host_sessions.sh

      - name: Ensure iOS simulator platform runtime
        timeout-minutes: 40
        run: |
          set -euo pipefail
          # The macos-26 runner image no longer pre-installs the iOS 26.0
          # simulator runtime for Xcode 26.0.1 (see actions/runner-images#13570
          # mitigation). The image DOES carry newer runtimes (iOS 26.2/26.4/26.5),
          # but the pinned Xcode 26.0.1 can only use a runtime of its own
          # SDK version — without iOS 26.0, xcodebuild cannot resolve the
          # 'generic/platform=iOS Simulator' destination and exits 70.
          # This step installs the pinned Xcode's OWN platform component —
          # it is NOT a toolchain substitution: the exact Xcode
          # 26.0.1 (17A400) pin selected above remains in force.
          SDK_VER=$(xcrun --sdk iphonesimulator --show-sdk-version)
          RUNTIME_ID="com.apple.CoreSimulator.SimRuntime.iOS-$(echo "$SDK_VER" | cut -d. -f1,2 | tr '.' '-')"
          echo "Pinned iphonesimulator SDK: $SDK_VER — required runtime id: $RUNTIME_ID"
          if xcrun simctl list runtimes 2>/dev/null | grep -q "$RUNTIME_ID"; then
            echo "Required runtime already present:"
            xcrun simctl list runtimes | grep "$RUNTIME_ID"
          else
            echo "Required runtime missing — downloading platform for the pinned Xcode (this can take several minutes)..."
            xcrun simctl list > /dev/null 2>&1 || true   # warm the simulator service
            xcodebuild -downloadPlatform iOS -architectureVariant universal || true
            if ! xcrun simctl list runtimes | grep -q "$RUNTIME_ID"; then
              echo "::error::ACCEPTANCE BLOCKER: iOS $SDK_VER simulator runtime could not be installed on this runner (Apple may no longer serve this platform build). Available runtimes:"
              xcrun simctl list runtimes || true
              exit 1
            fi
            echo "Runtime installed:"
            xcrun simctl list runtimes | grep "$RUNTIME_ID"
          fi

      - name: Build for iphonesimulator
        run: |
          set -euo pipefail
          xcodebuild -project Haymaker.xcodeproj \
            -scheme Haymaker \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath DerivedData \
            build

      - name: iPhone-only post-build assertion (built Info.plist)
        run: |
          set -euo pipefail
          APP=$(find DerivedData/Build/Products -maxdepth 2 -name "Haymaker.app" -type d | head -1)
          [ -n "$APP" ] || { echo "::error::built app not found"; exit 1; }
          echo "Checking $APP/Info.plist"
          fam=$(plutil -extract UIDeviceFamily xml1 -o - "$APP/Info.plist" \
                | grep -c "<integer>1</integer>")
          [ "$fam" = "1" ] || { echo "::error::UIDeviceFamily is not [1]: $(plutil -extract UIDeviceFamily xml1 -o - "$APP/Info.plist")"; exit 1; }
          if plutil -extract UIDeviceFamily xml1 -o - "$APP/Info.plist" | grep -q "<integer>2</integer>"; then
            echo "::error::built app declares iPad (UIDeviceFamily contains 2)"
            exit 1
          fi
          echo "Built app UIDeviceFamily == [1]: PASS"
          bundle_id=$(plutil -extract CFBundleIdentifier raw -o - "$APP/Info.plist")
          [ "$bundle_id" = "com.infinityball.haymaker" ] \
            || { echo "::error::bundle id is $bundle_id"; exit 1; }
          echo "Bundle id $bundle_id: PASS"
          [ -f "$APP/PrivacyInfo.xcprivacy" ] \
            || { echo "::error::PrivacyInfo.xcprivacy not embedded in app bundle"; exit 1; }
          echo "Privacy manifest embedded: PASS"

      - name: Run playable-bout UI journey on pinned simulator
        timeout-minutes: 40
        run: |
          set -euo pipefail
          SDK_VER=$(xcrun --sdk iphonesimulator --show-sdk-version)
          RUNTIME_ID="com.apple.CoreSimulator.SimRuntime.iOS-$(echo "$SDK_VER" | cut -d. -f1,2 | tr '.' '-')"
          export RUNTIME_ID
          # Select a real available iPhone device under the PINNED runtime;
          # create one if the runtime is installed but has no device.
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, os, sys
          devices = json.load(sys.stdin)["devices"].get(os.environ["RUNTIME_ID"], [])
          print(next((d["udid"] for d in devices if d["name"].startswith("iPhone")), ""))')
          if [ -z "$UDID" ]; then
            echo "No iPhone device for $RUNTIME_ID — creating one."
            DEVTYPE=$(xcrun simctl list devicetypes -j | python3 -c '
          import json, sys
          types = json.load(sys.stdin)["devicetypes"]
          iphones = [t["identifier"] for t in types if ".iPhone" in t["identifier"]]
          prefer = [t for t in iphones if "iPhone 17" in t]
          print((prefer or iphones)[0])')
            UDID=$(xcrun simctl create "Haymaker CI" "$DEVTYPE" "$RUNTIME_ID")
            trap 'xcrun simctl delete "$UDID" >/dev/null 2>&1 || true' EXIT
          fi
          echo "Testing exact head: $(git rev-parse HEAD) on simulator $UDID"
          xcodebuild -project Haymaker.xcodeproj \
            -scheme Haymaker \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath DerivedData \
            -resultBundlePath HaymakerUITests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO \
            test

      - name: Upload UI journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haymaker-uitests-xcresult
          path: HaymakerUITests.xcresult
          if-no-files-found: ignore
