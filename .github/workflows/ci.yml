name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fighter assets and texture seam regression tests
        run: python3 scripts/test_rig_fighters.py
      - name: Gitignore keeps signing material out
        run: |
          set -e
          for f in fake.p8 fake.p12 fake.mobileprovision fake.cer; do
            touch "$f"
            git check-ignore -q "$f" || { echo "FAIL: $f is not gitignored"; exit 1; }
            rm "$f"
          done
          echo "Signing-material gitignore check: PASS"

